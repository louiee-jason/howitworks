<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Facebook Connected</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <h1 id="title">Connecting Facebook…</h1>
  <div class="card" id="result"></div>
  <p class="muted">This page only shows the code Facebook sent back. Nothing is stored or sent anywhere from here.</p>
</main>
<script>
  const params = new URLSearchParams(location.search);
  const code = params.get("code");
  const error = params.get("error_description") || params.get("error");
  const title = document.getElementById("title");
  const box = document.getElementById("result");

  if (code) {
    title.textContent = "Facebook approved";
    box.innerHTML = '<p>Copy this code and paste it into the terminal where <strong>connect_meta.py</strong> is waiting. It expires in a few minutes.</p><code class="big" id="code"></code><button id="copy">Copy code</button>';
    document.getElementById("code").textContent = code;
    document.getElementById("copy").addEventListener("click", async (e) => {
      try {
        await navigator.clipboard.writeText(code);
        e.target.textContent = "Copied";
      } catch {
        e.target.textContent = "Select the code and copy it manually";
      }
    });
  } else {
    title.textContent = "Facebook did not approve";
    box.textContent = error ? `Facebook returned: ${error}` : "No code in the address. Start again from connect_meta.py.";
  }
  // Drop the code from the address bar and history
  history.replaceState(null, "", location.pathname);
</script>
</body>
</html>
